services:
  db:
    image: postgres:16-alpine
    container_name: opsdesk-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [opsnet]

  backend:
    build: ./backend
    container_name: opsdesk-api
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on: [db]
    networks: [opsnet]

  frontend:
    build: ./frontend
    container_name: opsdesk-web
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "80:80"
    networks: [opsnet]

volumes:
  postgres_data:

networks:
  opsnet:
    driver: bridge
